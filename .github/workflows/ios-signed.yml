name: Build & Sign iOS IPA (App Store / TestFlight)

# ──────────────────────────────────────────────
#  Gera o IPA assinado para App Store / TestFlight
#  Requer os Secrets configurados no GitHub:
#  IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
#  IOS_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD
# ──────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  build-signed:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)
          xcodebuild -version

      - name: Install iOS Platform
        run: xcodebuild -downloadPlatform iOS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi

      - name: Prepare iOS Project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          # Garantir que o workspace existe
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            cd ios/App && pod install
          fi

      - name: Install Apple Certificate & Provisioning Profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decodificar certificado e provisioning profile
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          echo "P12 size: $(wc -c < $CERTIFICATE_PATH) bytes"
          echo "PP size: $(wc -c < $PP_PATH) bytes"

          # Criar keychain temporária
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Importar certificado
          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Instalar provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Extrair UUID do provisioning profile usando grep (mais robusto)
          PP_UUID=$(grep -a -A1 '<key>UUID</key>' $PP_PATH | grep -o '[-A-Fa-f0-9]\{36\}')
          if [ -z "$PP_UUID" ]; then
            echo "⚠️ UUID nao extraido, copiando com nome fixo"
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision
          else
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
            echo "✅ Profile instalado (UUID: $PP_UUID)"
          fi
          echo "✅ Certificado instalado"

      - name: Build Signed Archive
        run: |
          cd ios/App
          
          # Extrair UUID do profile instalado
          PP_UUID=$(grep -a -A1 '<key>UUID</key>' $RUNNER_TEMP/build_pp.mobileprovision | grep -o '[-A-Fa-f0-9]\{36\}')
          echo "Using Provisioning Profile UUID: $PP_UUID"
          
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/FireCheck.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=5K9U9AF594 \
            PROVISIONING_PROFILE="$PP_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution"
          
          echo "✅ Archive criado"
          ls -la build/FireCheck.xcarchive/

      - name: Export IPA
        run: |
          cd ios/App

          # Extrair UUID do profile
          PP_UUID=$(grep -a -A1 '<key>UUID</key>' $RUNNER_TEMP/build_pp.mobileprovision | grep -o '[-A-Fa-f0-9]\{36\}')

          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>5K9U9AF594</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.grupohakim.firecheck</key>
              <string>$PP_UUID</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

          echo "=== ExportOptions.plist ==="
          cat ExportOptions.plist
          echo ""

          xcodebuild -exportArchive \
            -archivePath build/FireCheck.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

          echo "✅ IPA exportado"
          ls -la build/ipa/

      - name: Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: FireCheck-iOS-Signed
          path: ios/App/build/ipa/*.ipa

      - name: Cleanup Keychain
        if: ${{ always() }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
