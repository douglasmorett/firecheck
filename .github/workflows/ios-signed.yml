name: "Build and Sign iOS IPA (App Store / TestFlight)"

# ──────────────────────────────────────────────
#  Gera o IPA assinado para App Store / TestFlight
#  Requer os Secrets configurados no GitHub:
#  IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
#  IOS_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD
# ──────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  build-signed:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)
          xcodebuild -version

      - name: Install iOS Platform
        run: xcodebuild -downloadPlatform iOS || echo '⚠️ Download falhou (plataforma pode ja estar instalada)'
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi

      - name: Prepare iOS Project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          cd ios/App
          
          echo "=== Podfile original ==="
          cat Podfile
          
          # Desabilitar code signing nos Pods
          python3 ../../scripts/fix_podfile_signing.py Podfile
          
          echo "=== Podfile modificado ==="
          cat Podfile
          
          # Reinstalar pods com a nova configuracao
          pod install
          echo "✅ Pods reinstalados com CODE_SIGNING_ALLOWED=NO"

      - name: Configure Signing
        run: |
          cd ios/App
          PBXPROJ="App.xcodeproj/project.pbxproj"
          
          echo "=== Configurando signing manual ==="
          
          # Mudar Automatic para Manual signing
          sed -i '' 's/ProvisioningStyle = Automatic/ProvisioningStyle = Manual/g' $PBXPROJ
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' $PBXPROJ
          
          # Definir Team ID (ambos os formatos possiveis)
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 5K9U9AF594;/g' $PBXPROJ
          sed -i '' 's/DEVELOPMENT_TEAM = ""/DEVELOPMENT_TEAM = 5K9U9AF594/g' $PBXPROJ
          sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = 5K9U9AF594;/g' $PBXPROJ
          sed -i '' 's/DevelopmentTeam = ""/DevelopmentTeam = 5K9U9AF594/g' $PBXPROJ
          
          # Se DEVELOPMENT_TEAM nao existe nos build settings, adicionar apos CODE_SIGN_STYLE
          if ! grep -q "DEVELOPMENT_TEAM = 5K9U9AF594" $PBXPROJ; then
            sed -i '' '/CODE_SIGN_STYLE = Manual/a\
          				DEVELOPMENT_TEAM = 5K9U9AF594;' $PBXPROJ
          fi
          
          # Definir Code Sign Identity e Provisioning Profile para Release
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = ""/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' $PBXPROJ
          
          # Adicionar PROVISIONING_PROFILE_SPECIFIER em cada build configuration
          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" $PBXPROJ; then
            sed -i '' '/CODE_SIGN_STYLE = Manual/a\
          				PROVISIONING_PROFILE_SPECIFIER = "FireCheck App Store";' $PBXPROJ
          fi
          
          echo "✅ Signing configurado"
          echo "Manual count: $(grep -c 'Manual' $PBXPROJ || true)"
          echo "Team ID count: $(grep -c '5K9U9AF594' $PBXPROJ || true)"
          echo "Profile count: $(grep -c 'PROVISIONING_PROFILE_SPECIFIER' $PBXPROJ || true)"

      - name: Install Apple Certificate & Provisioning Profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decodificar certificado e provisioning profile
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          echo "P12 size: $(wc -c < $CERTIFICATE_PATH) bytes"
          echo "PP size: $(wc -c < $PP_PATH) bytes"

          # Criar keychain temporária
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Importar certificado
          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Instalar provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Extrair UUID usando python3 (mais robusto que grep em binario)
          PP_UUID=$(python3 -c "
          import subprocess, plistlib
          result = subprocess.run(['security', 'cms', '-D', '-i', '$PP_PATH'], capture_output=True)
          if result.returncode == 0:
              plist = plistlib.loads(result.stdout)
              print(plist['UUID'])
          else:
              # Fallback: tentar extrair direto do binario
              import re
              with open('$PP_PATH', 'rb') as f:
                  data = f.read().decode('latin-1')
              match = re.search(r'<key>UUID</key>\s*<string>([-A-Fa-f0-9]{36})</string>', data)
              if match:
                  print(match.group(1))
          ")
          
          echo "PP UUID extraido: '$PP_UUID'"
          
          if [ -z "$PP_UUID" ]; then
            echo "❌ ERRO: Nao foi possivel extrair UUID do provisioning profile"
            echo "PP file size: $(wc -c < $PP_PATH)"
            echo "PP file type: $(file $PP_PATH)"
            exit 1
          fi
          
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          echo "✅ Profile instalado: ~/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"
          
          # Verificar instalacao
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ Certificado instalado"
          
          # Salvar UUID para steps seguintes
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV

      - name: Build Signed Archive
        run: |
          cd ios/App
          
          echo "Using Provisioning Profile UUID: $PP_UUID"
          
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/FireCheck.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=5K9U9AF594 \
            CODE_SIGN_IDENTITY="Apple Distribution"
          
          echo "✅ Archive criado"
          ls -la build/FireCheck.xcarchive/

      - name: Export IPA
        run: |
          cd ios/App

          echo "Exporting with PP_UUID: $PP_UUID"

          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>5K9U9AF594</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.grupohakim.firecheck</key>
              <string>$PP_UUID</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

          echo "=== ExportOptions.plist ==="
          cat ExportOptions.plist
          echo ""

          xcodebuild -exportArchive \
            -archivePath build/FireCheck.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

          echo "✅ IPA exportado"
          ls -la build/ipa/

      - name: Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: FireCheck-iOS-Signed
          path: ios/App/build/ipa/*.ipa

      - name: Cleanup Keychain
        if: ${{ always() }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
