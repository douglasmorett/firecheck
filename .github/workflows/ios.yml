name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Remove Incomplete iOS Project
        run: rm -rf ios

      - name: Setup CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            echo "Installing CocoaPods..."
            sudo gem install cocoapods
          else
            echo "CocoaPods already installed: $(pod --version)"
          fi

      - name: Add iOS Platform
        run: npx cap add ios

      - name: Sync iOS (includes pod install)
        run: npx cap sync ios

      - name: Verify Xcode Project
        run: |
          echo "=== iOS Project Structure ==="
          ls -la ios/App/
          echo ""
          echo "=== Checking for workspace ==="
          ls -la ios/App/*.xcworkspace || echo "No workspace found"
          echo ""
          echo "=== Checking Podfile ==="
          cat ios/App/Podfile || echo "No Podfile"

      - name: Build iOS App (Simulator)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tail -40

      - name: Package Simulator App
        run: |
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip" App.app
            echo "✅ App empacotado com sucesso!"
          else
            echo "❌ App.app não encontrado, listando tudo em build:"
            find ios/App/build -name "*.app" -type d 2>/dev/null || echo "Nenhum .app encontrado"
            exit 1
          fi

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: FireCheck-iOS-Simulator
          path: FireCheck-iOS-Simulator.zip
