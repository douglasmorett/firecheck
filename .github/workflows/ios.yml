name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Remove Incomplete iOS Project
        run: rm -rf ios

      - name: Setup CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            echo "Installing CocoaPods..."
            sudo gem install cocoapods
          else
            echo "CocoaPods already installed: $(pod --version)"
          fi

      - name: Add iOS Platform
        run: npx cap add ios

      - name: Sync iOS (includes pod install)
        run: npx cap sync ios

      - name: Build iOS App (Simulator)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee /tmp/xcodebuild.log | tail -50
          echo ""
          echo "=== Build result: $? ==="

      - name: Find and Package App
        run: |
          echo "=== Procurando .app no build ==="
          # Listar TUDO recursivamente dentro do build
          find ios/App/build -type d -name "*.app" 2>/dev/null
          echo ""
          
          # O Xcode coloca o .app em: build/Build/Products/Debug-iphonesimulator/App.app
          PRODUCTS_DIR="ios/App/build/Build/Products/Debug-iphonesimulator"
          
          if [ -d "$PRODUCTS_DIR" ]; then
            echo "=== Products directory encontrado ==="
            ls -la "$PRODUCTS_DIR"
            
            # Encontrar o .app neste diretório
            APP=$(ls -d "$PRODUCTS_DIR"/*.app 2>/dev/null | head -1)
            
            if [ -n "$APP" ]; then
              echo "✅ App encontrado: $APP"
              cd "$PRODUCTS_DIR"
              APP_NAME=$(basename "$APP")
              zip -r "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip" "$APP_NAME"
              echo "✅ Empacotado! Tamanho:"
              ls -lh "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip"
            else
              echo "❌ Nenhum .app em Products"
              exit 1
            fi
          else
            echo "❌ Products dir nao encontrado: $PRODUCTS_DIR"
            echo "=== Estrutura completa do build ==="
            find ios/App/build -maxdepth 6 -type d | head -40
            
            # Fallback: procurar em qualquer lugar
            FALLBACK=$(find ios/App/build -type d -name "*.app" | grep -v ".app/" | head -1)
            if [ -n "$FALLBACK" ]; then
              echo "=== Fallback encontrado: $FALLBACK ==="
              cd "$(dirname "$FALLBACK")"
              zip -r "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip" "$(basename "$FALLBACK")"
              echo "✅ Empacotado via fallback!"
            else
              echo "❌ Nenhum .app encontrado em lugar nenhum"
              exit 1
            fi
          fi

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: FireCheck-iOS-Simulator
          path: FireCheck-iOS-Simulator.zip
