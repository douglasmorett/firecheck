name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Remove Incomplete iOS Project
        run: rm -rf ios

      - name: Setup CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Add iOS Platform
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: List Available Simulators
        run: xcrun simctl list devices available | grep iPhone | head -10

      - name: Build iOS App
        run: |
          cd ios/App
          
          # Listar schemes disponiveis
          xcodebuild -workspace App.xcworkspace -list
          
          # Build sem destination especifico - apenas SDK do simulador
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package App
        run: |
          # Listar todos os .app gerados
          echo "=== Apps encontrados ==="
          find ios/App/build -type d -name "*.app"
          
          # Pegar o primeiro .app (excluindo sub-bundles)
          APP=$(find ios/App/build -type d -name "*.app" | grep -v ".app/" | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERRO: Nenhum .app encontrado"
            find ios/App/build -maxdepth 5 -type d | head -20
            exit 1
          fi
          
          echo "Empacotando: $APP"
          cd "$(dirname "$APP")"
          zip -r "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip" "$(basename "$APP")"
          ls -lh "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip"

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: FireCheck-iOS-Simulator
          path: FireCheck-iOS-Simulator.zip
