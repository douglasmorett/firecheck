name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Prepare iOS Project
        run: |
          # Remover qualquer projeto iOS incompleto
          rm -rf ios
          
          # Adicionar plataforma iOS e sincronizar
          npx cap add ios
          npx cap sync ios
          
          # Verificar estrutura gerada
          echo "=== Verificando projeto iOS ==="
          ls -la ios/App/
          echo ""
          test -f ios/App/Podfile && echo "✅ Podfile existe" || echo "❌ Podfile ausente"
          test -d ios/App/App.xcodeproj && echo "✅ xcodeproj existe" || echo "❌ xcodeproj ausente"
          test -d ios/App/App.xcworkspace && echo "✅ xcworkspace existe" || echo "❌ xcworkspace ausente"

      - name: Install Pods (if workspace missing)
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "Workspace ausente, rodando pod install..."
            cd ios/App
            pod install
          else
            echo "✅ Workspace ja existe"
          fi

      - name: Build iOS App (Simulator)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES

      - name: Package App
        run: |
          APP=$(find ios/App/build -type d -name "*.app" | grep -v ".app/" | head -1)
          if [ -z "$APP" ]; then
            echo "❌ Nenhum .app encontrado"
            find ios/App/build -maxdepth 5 -type d | head -20
            exit 1
          fi
          echo "✅ Empacotando: $APP"
          cd "$(dirname "$APP")"
          zip -r "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip" "$(basename "$APP")"
          ls -lh "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip"

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: FireCheck-iOS-Simulator
          path: FireCheck-iOS-Simulator.zip
