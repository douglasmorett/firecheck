name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Remove Incomplete iOS Project
        run: rm -rf ios

      - name: Setup CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            echo "Installing CocoaPods..."
            sudo gem install cocoapods
          else
            echo "CocoaPods already installed: $(pod --version)"
          fi

      - name: Add iOS Platform
        run: npx cap add ios

      - name: Sync iOS (includes pod install)
        run: npx cap sync ios

      - name: Build iOS App (Simulator)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES \
            > /tmp/xcodebuild.log 2>&1 || true
          echo "=== Ultimas 30 linhas do build ==="
          tail -30 /tmp/xcodebuild.log
          echo ""
          # Verificar se o build realmente gerou o .app
          if find build -type d -name "*.app" 2>/dev/null | grep -q ".app"; then
            echo "✅ Build gerou .app com sucesso!"
          else
            echo "❌ Build nao gerou .app"
            echo "=== Erros do build ==="
            grep -i "error:" /tmp/xcodebuild.log | tail -10
            exit 1
          fi

      - name: Find and Package App
        run: |
          # Caminho padrao do Xcode para simulador
          PRODUCTS_DIR="ios/App/build/Build/Products/Debug-iphonesimulator"
          
          echo "=== Procurando .app ==="
          find ios/App/build -type d -name "*.app" 2>/dev/null
          echo ""
          
          if [ -d "$PRODUCTS_DIR" ]; then
            echo "✅ Products dir encontrado"
            ls -la "$PRODUCTS_DIR"
            APP=$(ls -d "$PRODUCTS_DIR"/*.app 2>/dev/null | head -1)
          fi
          
          # Fallback: procurar em qualquer lugar
          if [ -z "$APP" ]; then
            echo "Usando fallback..."
            APP=$(find ios/App/build -type d -name "*.app" | grep -v ".app/" | head -1)
          fi
          
          if [ -n "$APP" ]; then
            APP_NAME=$(basename "$APP")
            APP_DIR=$(dirname "$APP")
            echo "✅ App encontrado: $APP"
            cd "$APP_DIR"
            zip -r "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip" "$APP_NAME"
            echo "✅ Empacotado!"
            ls -lh "$GITHUB_WORKSPACE/FireCheck-iOS-Simulator.zip"
          else
            echo "❌ Nenhum .app encontrado"
            find ios/App/build -maxdepth 6 -type d 2>/dev/null | head -30
            exit 1
          fi

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: FireCheck-iOS-Simulator
          path: FireCheck-iOS-Simulator.zip
